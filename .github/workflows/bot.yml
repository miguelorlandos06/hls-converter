name: Telegram Bot (persistent)

on:
  workflow_dispatch:

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run bot + schedule next
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          (
            sleep 5h
            echo "Self-dispatch..."
            curl -s -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/workflows/bot.yml/dispatches" \
              -d '{"ref":"main"}'
          ) &
          DISPATCH_PID=$!
          timeout 5h45m python bot.py || true
          kill $DISPATCH_PID 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/hls_jobs
